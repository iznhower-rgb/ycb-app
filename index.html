<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y.C.B</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .prediction {
      background: #334155;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      text-align: right;
    }

    .rank {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Y.C.B</h1>

    <div class="subtitle">
      Football Prediction Engine
    </div>

    <div class="card">

      <h2>اختر مباراة</h2>

      <input
        type="text"
        id="match"
        placeholder="مثال: Barcelona vs Real Madrid"
      >

      <button onclick="analyze()">
        تحليل المباراة
      </button>

    </div>

    <div id="result">

      <h2>أفضل التوقعات</h2>

      <div class="prediction">
        <div class="rank">🥇 التوقع الأول</div>
        <div>سيظهر هنا بعد بناء محرك Y.C.B</div>
      </div>

      <div class="prediction">
        <div class="rank">🥈 التوقع الثاني</div>
        <div>سيظهر هنا بعد بناء محرك Y.C.B</div>
      </div>

      <div class="prediction">
        <div class="rank">🥉 التوقع الثالث</div>
        <div>سيظهر هنا بعد بناء محرك Y.C.B</div>
      </div>

    </div>

  </div>

  <script>
    function analyze() {

      const match = document.getElementById("match").value.trim();

      if (!match) {
        alert("اكتب اسم المباراة أولاً");
        return;
      }

      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
