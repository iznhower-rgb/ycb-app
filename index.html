<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Y.C.B</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #0f172a;

  color:
    white;

  text-align:
    center;

}

.app {

  max-width:
    500px;

  margin:
    auto;

  padding:
    30px 20px;

}

h1 {

  font-size:
    42px;

  margin:
    10px 0 5px;

}

.subtitle {

  color:
    #94a3b8;

  margin-bottom:
    35px;

}

.card {

  background:
    #1e293b;

  border-radius:
    18px;

  padding:
    22px;

  margin-bottom:
    20px;

}

input {

  width:
    100%;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  font-size:
    16px;

  margin-bottom:
    15px;

  text-align:
    center;

}

button {

  width:
    100%;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  background:
    #22c55e;

  color:
    white;

  font-size:
    18px;

  font-weight:
    bold;

}

button:disabled {

  opacity:
    0.6;

}

#status {

  margin-top:
    15px;

  color:
    #94a3b8;

}

#result {

  display:
    none;

  margin-top:
    25px;

}

.prediction {

  background:
    #334155;

  border-radius:
    12px;

  padding:
    15px;

  margin:
    10px 0;

  text-align:
    right;

}

.rank {

  font-size:
    20px;

  font-weight:
    bold;

  margin-bottom:
    8px;

}

.probability {

  color:
    #4ade80;

  font-size:
    19px;

  font-weight:
    bold;

}

.error {

  color:
    #f87171 !important;

}

</style>

</head>


<body>

<div class="app">

<h1>
Y.C.B
</h1>

<div class="subtitle">
Football Prediction Engine
</div>


<div class="card">

<h2>
اختر مباراة
</h2>

<input
  id="match"
  type="text"
  placeholder="Barcelona vs Real Madrid"
>

<button
  id="button"
  onclick="analyze()"
>
تحليل المباراة
</button>

<div id="status"></div>

</div>


<div id="result">

<h2>
أفضل التوقعات
</h2>


<div class="prediction">

<div
  class="rank"
  id="p1"
>
🥇 التوقع الأول
</div>

<div
  class="probability"
  id="v1"
></div>

</div>


<div class="prediction">

<div
  class="rank"
  id="p2"
>
🥈 التوقع الثاني
</div>

<div
  class="probability"
  id="v2"
></div>

</div>


<div class="prediction">

<div
  class="rank"
  id="p3"
>
🥉 التوقع الثالث
</div>

<div
  class="probability"
  id="v3"
></div>

</div>

</div>

</div>


<script>

async function analyze() {

  const input =
    document.getElementById(
      "match"
    );

  const button =
    document.getElementById(
      "button"
    );

  const status =
    document.getElementById(
      "status"
    );

  const result =
    document.getElementById(
      "result"
    );


  const match =
    input.value.trim();


  if (!match) {

    status.className =
      "error";

    status.textContent =
      "اكتب المباراة أولاً";

    return;

  }


  button.disabled =
    true;

  status.className =
    "";

  status.textContent =
    "جاري التحليل...";

  result.style.display =
    "none";


  try {

    const response =
      await fetch(
        "/api/analyze",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              match:
                match

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(

        data.error ||
        "فشل التحليل"

      );

    }


    const predictions =
      data.predictions;


    if (
      !Array.isArray(
        predictions
      ) ||
      predictions.length !== 3
    ) {

      throw new Error(
        "نتيجة Y.C.B غير مكتملة"
      );

    }


    document
      .getElementById("p1")
      .textContent =
        "🥇 " +
        predictions[0].label;


    document
      .getElementById("v1")
      .textContent =
        predictions[0].probability +
        "%";


    document
      .getElementById("p2")
      .textContent =
        "🥈 " +
        predictions[1].label;


    document
      .getElementById("v2")
      .textContent =
        predictions[1].probability +
        "%";


    document
      .getElementById("p3")
      .textContent =
        "🥉 " +
        predictions[2].label;


    document
      .getElementById("v3")
      .textContent =
        predictions[2].probability +
        "%";


    result.style.display =
      "block";


    status.className =
      "";

    status.textContent =
      "تم التحليل بواسطة Y.C.B";


  } catch (error) {

    status.className =
      "error";

    status.textContent =
      error.message ||
      "حدث خطأ";


  } finally {

    button.disabled =
      false;

  }

}

</script>

</body>

</html>
